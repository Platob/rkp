name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java for Spark integration tests
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          working-directory: python

      - name: Install locked test and development dependencies
        run: uv sync --project python --locked --extra test --group dev

      - name: Run tests
        run: uv run --project python --extra test --group dev pytest -q

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run --project python --group dev ruff check python/src python/tests python/benchmarks docs/examples
          uv run --project python --group dev ruff format --check python/src python/tests python/benchmarks docs/examples

      - name: Type-check the package
        if: matrix.python-version == '3.12'
        run: >-
          uv run --project python --group dev
          mypy python/src/rkp python/tests/typing/record_methods.py
          --ignore-missing-imports

      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        working-directory: python
        run: uv run --extra test --group dev pip-audit

      - name: Build and validate distributions
        if: matrix.python-version == '3.12'
        run: |
          uv build --project python --no-sources
          uv run --project python --group dev twine check python/dist/*
