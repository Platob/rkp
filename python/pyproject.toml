[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "yggdryl"
version = "0.1.0"
description = "Native Yggdryl schemas, dataclass-compatible records, identifiers, and byte codecs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
dependencies = [
  "pyarrow>=15",
  "typing_extensions>=4.4; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["mypy>=1.15", "pytest>=8"]

[tool.maturin]
bindings = "pyo3"
exclude = ["**/__pycache__", "**/__pycache__/**", "**/*.pyc"]
module-name = "yggdryl._native"
python-source = "."
strip = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
