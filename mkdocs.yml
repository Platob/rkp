# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: rkp
site_description: Dataclass records with Arrow, Spark, Iceberg, and AWS Glue interoperability
site_url: https://platob.github.io/rkp/
repo_name: Platob/rkp
repo_url: https://github.com/Platob/rkp
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Records: records.md
  - FIX fields: fix.md
  - Arrow: arrow.md
  - Avro: avro.md
  - Spark: spark.md
  - Iceberg: iceberg.md
  - AWS Glue: aws-glue.md
  - PostgreSQL ADBC: integrations.md
  - Codecs: codecs.md
  - Public API: reference/index.md
  - Benchmarks and development: benchmarks-development.md

validation:
  links:
    anchors: warn
    not_found: warn
    unrecognized_links: warn
  nav:
    absolute_links: warn
    not_found: warn
    omitted_files: warn
